@if (loading.isBusy()) {
  <section class="global-loading" aria-live="polite" aria-busy="true">
    <div class="backdrop"></div>
    <div class="indicator">
      <img src="/logo.png" alt="" class="loader-logo" aria-hidden="true" />
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
      <p>Procesando...</p>
    </div>
  </section>
}
