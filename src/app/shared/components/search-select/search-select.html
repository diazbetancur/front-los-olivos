<div class="search-select" (focusout)="onFocusOut($event)">
  <div class="search-select__input-wrap">
    <input
      type="text"
      [attr.id]="inputId || null"
      [value]="inputValue"
      [placeholder]="placeholder"
      (input)="onInput($any($event.target).value)"
      autocomplete="off"
    />
    @if (inputValue) {
      <button type="button" class="search-select__clear" (click)="clear()" aria-label="Limpiar">×</button>
    }
  </div>

  @if (isOpen) {
    <div class="search-select__dropdown">
      @if (state === 'loading') {
        <div class="search-select__message">Buscando...</div>
      } @else if (state === 'empty') {
        <div class="search-select__message">Sin resultados</div>
      } @else if (state === 'error') {
        <div class="search-select__message search-select__message--error">Error al buscar</div>
      } @else if (state === 'results') {
        @for (option of options; track option.id) {
          <button
            type="button"
            class="search-select__option"
            [class.search-select__option--selected]="selectedOption?.id === option.id"
            (click)="selectOption(option)"
          >
            <span class="search-select__option-label">{{ option.label }}</span>
            @if (option.sublabel) {
              <span class="search-select__option-sublabel">{{ option.sublabel }}</span>
            }
          </button>
        }
      }
    </div>
  }
</div>
