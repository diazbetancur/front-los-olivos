<section class="modal-root" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">
  <button type="button" class="backdrop" (click)="onBackdropClick()" aria-label="Cerrar"></button>
  <section #panel class="panel" [style.width]="'min(' + maxWidth + ', calc(100vw - 2rem))'" tabindex="-1">
    <ng-content />
  </section>
</section>
