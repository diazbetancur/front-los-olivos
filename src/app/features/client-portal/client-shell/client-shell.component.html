<div class="portal-layout">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">O</span>
      <div>
        <span class="brand-name">Los Olivos</span>
        <span class="brand-sub">Portal cliente</span>
      </div>
    </div>

    <nav class="nav" aria-label="Portal cliente">
      <a routerLink="/client/contracts" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        Mis contratos
      </a>
      <a routerLink="/client/profile" routerLinkActive="active">
        Mi perfil
      </a>
    </nav>

    <div class="user-area">
      <div class="identity">
        <strong>{{ displayName() }}</strong>
        <span>{{ currentUser()?.userName }}</span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="workspace">
    <router-outlet />
  </main>
</div>
